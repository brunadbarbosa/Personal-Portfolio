<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100;0,400;0,700;1,100;1,400;1,700&family=Rubik:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <section class="body--content">
      <header class="header">
        <div class="container">
          <h1 class="header__title">Bruna Barbosa</h1>
          <nav>
            <ul class="header__list">
              <li><a href="./index.html" class="header__link">Home</a></li>
              <li>
                <a href="./portfolio.html" class="header__link">Portfolio</a>
              </li>
              <li><a href="./contact.html" class="header__link">Contact</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <section class="sign-up">
        <div class="container">
          <div class="sign-up__wrap">
            <form action="#" class="sign-up__form">
              <div class="form-unit full">
                <h1 class="sign-up__title">Send me a message!</h1>
                <p>Fill this form to get in touch with me about anything! I'll love to here from you!</p>
              </div>

              <div class="form-unit">
                <label for="fName">First Name</label>
                <input type="text" id="fName" name="fName" />
              </div>

              <div class="form-unit">
                <label for="lName">Last Name</label>
                <input type="text" id="lName" name="lName" />
              </div>

              <div class="form-unit">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" />
              </div>

              <div class="form-unit">
                <label for="tel">Phone</label>
                <input type="text" id="tel" name="tel" />
              </div>

              <div class="form-unit full">
                <label for="message">Message</label>
                <textarea
                  type="text"
                  id="message"
                  name="message"
                  required
                ></textarea>
              </div>

              <div class="form-unit full">
                <input class="btn" type="submit" value="Submit" />
              </div>
            </form>
          </div>
        </div>
      </section>

      <footer class="footer">
        <div class="container">
          <a href="/" class="footer__logo">
            <span class="footer__title">Bruna Barbosa</span>
          </a>

          <nav class="footer__nav">
            <ul class="footer__list">
              <li><a href="./index.html" class="footer__link">Home</a></li>
              <li>
                <a href="./portfolio.html" class="footer__link">Portfolio</a>
              </li>
              <li><a href="./contact.html" class="footer__link">Contact</a></li>
            </ul>
          </nav>

          <small class="footer__copyright">
            &copy; 2023 Algonquin College
          </small>
        </div>
      </footer>
    </section>
  </body>
</html>
